<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"> 
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    

<form>
    <h1 align="center" style="margin-top: 2%;">FORM BIODATA MAHASANTRI PeTI'</h1>
  <div class="form-group row" style="padding-left: 5%">
    <label for="text" class="col-2 col-form-label">Nama</label> 
    <div class="col-8">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <i class="fa fa-address-book"></i>
          </div>
        </div> 
        <input id="text" name="text" type="text" class="form-control">
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%">
    <label for="text1" class="col-2 col-form-label">NIM</label> 
    <div class="col-8">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <i class="fa fa-address-card"></i>
          </div>
        </div> 
        <input id="text1" name="text1" type="text" class="form-control">
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%">
    <label for="text2" class="col-2 col-form-label">Email</label> 
    <div class="col-8">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <i class="fa fa-envelope"></i>
          </div>
        </div> 
        <input id="text2" name="text2" type="text" class="form-control">
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%">
    <label class="col-2">Jurusan</label> 
    <div class="col-8">
      <div class="custom-control custom-radio custom-control-inline">
        <input name="radio" id="radio_0" type="radio" class="custom-control-input" value="sd"> 
        <label for="radio_0" class="custom-control-label">Software Development</label>
      </div>
      <div class="custom-control custom-radio custom-control-inline">
        <input name="radio" id="radio_1" type="radio" class="custom-control-input" value="dm"> 
        <label for="radio_1" class="custom-control-label">Digital Marketing</label>
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%">
    <label for="select" class="col-2 col-form-label">Matakuliah</label> 
    <div class="col-8">
      <select id="select" name="select" class="custom-select">
        <option value="wd">Web Design</option>
        <option value="db">Database SQL</option>
        <option value="PHP">Pemrograman PHP</option>
        <option value="py">Pemrograman Python</option>
      </select>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%">
    <label class="col-2">Checkboxes</label> 
    <div class="col-8">
      <div class="custom-control custom-checkbox custom-control-inline">
        <input name="checkbox" id="checkbox_0" type="checkbox" class="custom-control-input" value="a"> 
        <label for="checkbox_0" class="custom-control-label">Mancing</label>
      </div>
      <div class="custom-control custom-checkbox custom-control-inline">
        <input name="checkbox" id="checkbox_1" type="checkbox" class="custom-control-input" value="b" checked="checked"> 
        <label for="checkbox_1" class="custom-control-label">Membaca</label>
      </div>
      <div class="custom-control custom-checkbox custom-control-inline">
        <input name="checkbox" id="checkbox_2" type="checkbox" class="custom-control-input" value="c" checked="checked"> 
        <label for="checkbox_2" class="custom-control-label">Olahraga</label>
      </div>
      <div class="custom-control custom-checkbox custom-control-inline">
        <input name="checkbox" id="checkbox_3" type="checkbox" class="custom-control-input" value="d"> 
        <label for="checkbox_3" class="custom-control-label">Menonton</label>
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%">
    <label for="textarea" class="col-2 col-form-label">Alamat</label> 
    <div class="col-8">
      <textarea id="textarea" name="textarea" cols="40" rows="5" class="form-control"></textarea>
    </div>
  </div> 
  <div class="form-group row" style="padding-left: 60%">
    <div class="offset-4 col-2">
      <button name="submit" type="submit" class="btn btn-primary">masuk</button>
    </div>
  </div>
</form>

</body>
</html>
